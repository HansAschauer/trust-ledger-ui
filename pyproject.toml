[project]
name = "trust-ledger-ui"
version = "0.0.1"
description = "Local web UI for browsing a trust-ledger and attesting claims (single or batch), with review packs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hans Aschauer", email = "trust-ledger@ch23.de" }
]
requires-python = ">=3.11"
dependencies = []   # standard library only; the JavaScript (Alpine.js, KaTeX) is vendored in static/

[project.urls]
Repository = "https://github.com/HansAschauer/trust-ledger-ui"

[project.scripts]
ledger-ui = "trust_ledger_ui.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
